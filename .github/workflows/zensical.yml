name: ♻ zensical

on:
  workflow_call:
    inputs:
      runs_on:
        description: The label of the runner (GitHub- or self-hosted) to run this workflow on. Defaults to `ubuntu-24.04`.
        type: string
        required: false
        default: ubuntu-24.04

      python_version:
        description: The version of Python to install. Defaults to the version specified in the `.python-version` file.
        type: string
        required: false

      zensical_version:
        description: The version of Zensical to install.
        type: string
        required: false
        default: '0.0.64'

      requirements:
        description: A requirement specifier or the path of a pip requirements file (usually `requirements.txt`) that specifies Python dependencies to install.
        type: string
        required: false

      dependency_group:
        description: A named dependency-group from a `pyproject.toml` file. Defaults to using the default dependency groups in the current directory.
        type: string
        required: false

      strict_mode:
        description: Should strict mode be enabled? This will cause Zensical to abort the build on any warnings.
        type: boolean
        required: false
        default: false

      upload_artifact:
        description: Should the Zensical build artifact be uploaded? Defaults to `true`.
        type: boolean
        required: false
        default: true

      artifact_name:
        description: The name of the artifact to upload. Defaults to `zensical`.
        type: string
        required: false
        default: zensical

      git_fetch_depth:
        description: The number of commits that Git should fetch. Defaults to `1` (to decrease build time). Fetch depth `0` may be required by some Zensical integrations.
        type: number
        required: false
        default: 1

    outputs:
      artifact_uploaded:
        description: Was the Zensical build artifact uploaded?
        value: ${{ inputs.upload_artifact }}

      artifact_name:
        description: The name of the uploaded artifact containing the site.
        value: ${{ inputs.artifact_name }}

permissions: {}

jobs:
  zensical:
    name: Zensical
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read # Required to checkout the repository
    env:
      SITE_DIR: site
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.git_fetch_depth }}

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
          DEPENDENCY_GROUP: ${{ inputs.dependency_group }}
        run: |
          if [[ -f pyproject.toml ]]; then
            sync_args=()
            if [[ -n "$DEPENDENCY_GROUP" ]]; then
              sync_args+=(--group "$DEPENDENCY_GROUP")
            fi
            uv sync "${sync_args[@]}"
          elif [[ -n "$REQUIREMENTS" ]]; then
            uv venv
            if [[ -f "$REQUIREMENTS" ]]; then
              uv pip install -r "$REQUIREMENTS"
            else
              uv pip install "$REQUIREMENTS"
            fi
          elif [[ -n "$DEPENDENCY_GROUP" ]]; then
            echo "dependency_group requires a pyproject.toml file" >&2
            exit 1
          fi

      - name: Install Zensical
        env:
          ZENSICAL_VERSION: ${{ inputs.zensical_version }}
        run: |
          # Skip if the project already declares its own zensical dependency.
          if [[ ! -x .venv/bin/zensical ]]; then
            uv tool install "zensical@$ZENSICAL_VERSION"
            echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          fi

      - name: Run Zensical build
        env:
          STRICT_MODE: ${{ inputs.strict_mode }}
        run: |
          optional_args=()
          if [[ "$STRICT_MODE" == "true" ]]; then
            optional_args+=(--strict)
          fi

          if [[ -x .venv/bin/zensical ]]; then
            uv run zensical build "${optional_args[@]}"
          else
            zensical build "${optional_args[@]}"
          fi

      - name: Create tarball
        id: tar
        if: inputs.upload_artifact
        working-directory: ${{ env.SITE_DIR }}
        run: |
          tarball="$RUNNER_TEMP/$ARTIFACT_NAME.tar"
          tar -cf "$tarball" .
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.tar.outputs.tarball }}
